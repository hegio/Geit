name: Geit 自动聚合与校验

on:
  schedule:
    # GitHub cron 无法直接表达 18 小时；每 6 小时唤醒一次，由 gate 只放行每 3 个时间片。
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'sources.txt'
      - 'fetch_tvbox.py'
      - 'config_security.py'
      - 'py/**.py'
      - '.github/workflows/collect.yml'

permissions:
  contents: write

concurrency:
  group: geit-collect
  cancel-in-progress: false

jobs:
  schedule-gate:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
    steps:
      - name: 判断是否到 18 小时执行窗口
        id: gate
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          slot=$(( $(date -u +%s) / 21600 ))
          if [ $((slot % 3)) -eq 0 ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

  collect:
    needs: schedule-gate
    if: needs.schedule-gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: python -m pip install --upgrade pip pycryptodome

      - name: 生成 TVBox 配置
        env:
          PYTHONIOENCODING: utf-8
        run: python fetch_tvbox.py

      - name: 静态校验
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python -m py_compile fetch_tvbox.py check_health.py config_security.py
          python - <<'PY'
          import ast
          import json
          from pathlib import Path
          from config_security import find_sensitive_credentials

          for name in ("geit.json", "geitpy.json"):
              config = json.loads(Path(name).read_text(encoding="utf-8"))
              assert isinstance(config, dict), name
              assert isinstance(config.get("sites"), list), name
              assert isinstance(config.get("lives"), list), name
              assert str(config.get("spider", "")).startswith("https://"), name
              assert not find_sensitive_credentials(config), name

          pairs = (
              ("geit-fish.txt", "geit.json"),
              ("geitpy-fish.txt", "geitpy.json"),
          )
          for fish_name, json_name in pairs:
              raw = Path(fish_name).read_text(encoding="utf-8-sig")
              assert "**" not in raw[:16], f"{fish_name} is still wrapped"
              fish = json.loads(raw)
              source = json.loads(Path(json_name).read_text(encoding="utf-8"))
              assert fish["sites"] == source["sites"], fish_name
              assert fish["lives"] == source["lives"], fish_name
              for key in ("sites", "lives", "parses", "rules", "doh", "flags", "ijk", "ads"):
                  assert isinstance(fish.get(key), list), f"{fish_name}: {key}"
              assert isinstance(fish.get("logo"), str), fish_name
              assert not find_sensitive_credentials(fish), fish_name

          import hashlib
          hashes = {}
          for path in Path("py").glob("*.py"):
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              assert digest not in hashes, f"duplicate Python: {path} == {hashes[digest]}"
              hashes[digest] = path
          for path in Path("py").glob("*.py"):
              ast.parse(path.read_text(encoding="utf-8-sig", errors="replace"))
          assert Path("tvbox/lives/merged.m3u").read_text(encoding="utf-8").startswith("#EXTM3U")
          print("TVBox outputs validated")
          PY

      - name: 提交生成结果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add geit.json geitpy.json geit-fish.txt geitpy-fish.txt py tvbox/lives docs/sources.json docs/tvbox.json docs/index.html
          if git diff --cached --quiet; then
            echo "没有变化，跳过提交"
          else
            git commit -m "chore: 自动聚合 TVBox 配置 $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M')"
            for attempt in 1 2 3; do
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "推送失败，已重试 3 次" >&2
                exit 1
              fi
              git pull --rebase origin "${GITHUB_REF_NAME}"
            done
          fi

      - name: 上传诊断文件
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geit-diagnostics
          path: |
            geit.json
            geitpy.json
            geit-fish.txt
            geitpy-fish.txt
            docs/sources.json
          if-no-files-found: warn
          retention-days: 7
