name: Geit 自动聚合与校验

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'sources.txt'
      - 'fetch_tvbox.py'
      - 'check_health.py'
      - 'config_security.py'
      - 'py/**.py'
      - '.github/workflows/collect.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: geit-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: python -m pip install --upgrade pip pycryptodome

      - name: 生成 TVBox 配置
        env:
          PYTHONIOENCODING: utf-8
        run: python fetch_tvbox.py

      - name: 静态校验
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python -m py_compile fetch_tvbox.py check_health.py config_security.py
          python - <<'PY'
          import ast
          import json
          from pathlib import Path
          from config_security import find_sensitive_credentials

          for name in ("geit.json", "geitpy.json"):
              config = json.loads(Path(name).read_text(encoding="utf-8"))
              assert isinstance(config, dict), name
              assert isinstance(config.get("sites"), list), name
              assert isinstance(config.get("lives"), list), name
              assert str(config.get("spider", "")).startswith("https://"), name
              assert not find_sensitive_credentials(config), name

          for path in Path("py").glob("*.py"):
              ast.parse(path.read_text(encoding="utf-8-sig", errors="replace"))
          assert Path("tvbox/lives/merged.m3u").read_text(encoding="utf-8").startswith("#EXTM3U")
          print("TVBox outputs validated")
          PY

      - name: 检查链接健康状态（每轮抽样 500 个直播频道）
        env:
          PYTHONIOENCODING: utf-8
        run: python check_health.py --workers 16 --max-channels 500 --probe

      - name: 提交生成结果
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add geit.json geitpy.json py tvbox/lives docs/health.json docs/health.csv docs/blocked.csv docs/sources.json docs/tvbox.json docs/index.html
          if git diff --cached --quiet; then
            echo "没有变化，跳过提交"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: 自动聚合 TVBox 配置 $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M')"
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 推送生成结果后继续校验
        if: steps.commit.outputs.pushed == 'true' && github.event_name != 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run collect.yml --ref "${GITHUB_REF_NAME}"

      - name: 上传诊断文件
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geit-diagnostics
          path: |
            geit.json
            geitpy.json
            docs/health.json
            docs/health.csv
            docs/blocked.csv
          if-no-files-found: warn
          retention-days: 7
