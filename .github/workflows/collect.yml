name: TVBox 自动采集

on:
  schedule:
    - cron: '0 */6 * * *'        # 每 6 小时（UTC）执行一次：00:00 / 06:00 / 12:00 / 18:00
  workflow_dispatch:            # 允许在 Actions 页面手动点「Run workflow」触发
  push:
    paths:
      - 'sources.txt'
      - 'fetch_tvbox.py'

permissions:
  contents: write               # 允许工作流把采集结果提交回仓库

concurrency:
  group: tvbox-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: python -m pip install --quiet pycryptodome

      - name: 运行采集脚本
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python fetch_tvbox.py

      - name: 提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 用 -A 而不是指定具体目录：本批若没有任何文件被采集，也不会因目录不存在而报错退出
          git add -A
          if git diff --cached --quiet; then
            echo "没有变化，跳过提交"
          else
            git commit -m "chore: 自动采集 TVBox 配置 $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M')"
            git push
          fi
