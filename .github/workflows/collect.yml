name: Geit 自动聚合与校验

on:
  schedule:
    # GitHub 的 cron 按“小时字段的取值”触发，0 */18 实际是 00、18 点，
    # 间隔会变成 18/6 小时交替。因此每小时唤醒一次，再由 gate 用 epoch
    # 小时取模，真正每 18 小时只放行一次。
    - cron: '0 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'sources.txt'
      - 'fetch_tvbox.py'
      - 'config_security.py'
      - 'check_health.py'
      - 'tvbox/channel_rules.json'
      - 'py/**.py'
      - 'docs/removable.json'
      - 'docs/dead_channels.json'
      - '.github/workflows/collect.yml'

permissions:
  contents: write

concurrency:
  group: geit-collect
  cancel-in-progress: false

jobs:
  schedule-gate:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
    steps:
      - name: 判断是否到 18 小时执行窗口
        id: gate
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          hour=$(( $(date -u +%s) / 3600 ))
          if [ $((hour % 18)) -eq 0 ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

  collect:
    needs: schedule-gate
    if: needs.schedule-gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: python -m pip install --upgrade pip pycryptodome

      - name: 生成 TVBox 配置
        env:
          PYTHONIOENCODING: utf-8
        run: python fetch_tvbox.py

      - name: 静态校验
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python -m py_compile fetch_tvbox.py check_health.py ai_assist.py config_security.py
          python -m unittest discover -s tests -v
          python - <<'PY'
          import ast
          import json
          from pathlib import Path
          from config_security import find_sensitive_credentials

          legacy = json.loads(Path("docs/tvbox.json").read_text(encoding="utf-8"))
          for name in ("geit-fish", "geitpy-fish"):
              raw = Path(name).read_text(encoding="utf-8-sig")
              # 旧版会写成 8 字符**Base64，影视 App 无法解析；必须保持明文 JSON。
              assert "**" not in raw[:16], f"{name} is still wrapped"
              config = json.loads(raw)
              assert isinstance(config, dict), name
              for key in ("sites", "lives", "parses", "rules", "doh", "flags", "ijk", "ads"):
                  assert isinstance(config.get(key), list), f"{name}: {key}"
              assert isinstance(config.get("logo"), str), name
              assert str(config.get("spider", "")).startswith("https://"), name
              assert not find_sensitive_credentials(config), name

          # 兼容入口必须和根目录订阅文件内容一致，旧链接才不会失效。
          base = json.loads(Path("geit-fish").read_text(encoding="utf-8"))
          assert legacy["sites"] == base["sites"], "docs/tvbox.json 与 geit-fish 不一致"
          assert legacy["lives"] == base["lives"], "docs/tvbox.json 与 geit-fish 不一致"

          import hashlib
          hashes = {}
          for path in Path("py").glob("*.py"):
              # 与 fetch_tvbox.py 一致：先归一化 CRLF 再哈希，避免本地/CI 判定不同。
              digest = hashlib.sha256(path.read_bytes().replace(b"\r\n", b"\n")).hexdigest()
              assert digest not in hashes, f"duplicate Python: {path} == {hashes[digest]}"
              hashes[digest] = path
          for path in Path("py").glob("*.py"):
              ast.parse(path.read_text(encoding="utf-8-sig", errors="replace"))
          assert Path("tvbox/lives/merged.m3u").read_text(encoding="utf-8").startswith("#EXTM3U")
          ledger = json.loads(Path("docs/channel_ledger.json").read_text(encoding="utf-8"))
          assert ledger["summary"]["channels"] > 0, "channel ledger is empty"
          assert ledger["summary"]["channels"] == sum(
              entry["line_count"] for entry in ledger["channels"]
          ), "channel ledger counts do not match"
          print("TVBox outputs validated")
          PY

      - name: 提交生成结果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add geit-fish geitpy-fish py tvbox/lives docs/sources.json docs/inventory.json docs/inventory.csv docs/tvbox.json docs/index.html docs/channel_ledger.json docs/classification_review.json
          if git diff --cached --quiet; then
            echo "没有变化，跳过提交"
          else
            git commit -m "chore: 自动聚合 TVBox 配置 $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M')"
            for attempt in 1 2 3; do
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "推送失败，已重试 3 次" >&2
                exit 1
              fi
              git pull --rebase origin "${GITHUB_REF_NAME}"
            done
          fi

      - name: 上传诊断文件
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geit-diagnostics
          path: |
            geit-fish
            geitpy-fish
            docs/sources.json
          if-no-files-found: warn
          retention-days: 7
