name: lytvs 定时采集+镜像

on:
  schedule:
    # 每 6 小时执行一次 (UTC 00:00, 06:00, 12:00, 18:00)
    # 对应北京时间 08:00, 14:00, 20:00, 02:00
    - cron: '0 */6 * * *'
  workflow_dispatch: # 支持手动触发

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 完整历史，便于 diff 检测变更

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 采集最新配置
        env:
          LYTVS_TOKEN: ${{ secrets.LYTVS_TOKEN }}
        run: python fetch.py

      - name: 镜像所有资源文件
        env:
          LYTVS_TOKEN: ${{ secrets.LYTVS_TOKEN }}
        run: python mirror.py

      - name: 提交变更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ mirror/
          if git diff --staged --quiet; then
            echo "本次无变更"
          else
            git commit -m "chore: 自动采集+镜像 $(date -u '+%Y-%m-%d %H:%M') UTC"
            git push
          fi
