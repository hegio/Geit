name: 定时采集订阅配置

on:
  schedule:
    # 每 6 小时跑一次（UTC 时间：00:00 / 06:00 / 12:00 / 18:00）
    - cron: "0 */6 * * *"
  workflow_dispatch: {}   # 允许在 Actions 页面手动触发

permissions:
  contents: write        # 需要写权限把采集结果提交回仓库

jobs:
  lingdie:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖（curl_cffi：模拟 Chrome TLS 指纹，绕过 WAF 对脚本指纹的 403）
        run: pip install --upgrade curl_cffi

      - name: 检查 SUB_URL 密钥是否已配置
        env:
          SUB_URL: ${{ secrets.SUB_URL }}
        run: |
          if [ -z "$SUB_URL" ]; then
            echo "ERROR: 仓库 Secrets 中未找到 SUB_URL 或值为空。"
            echo "请前往 Settings → Secrets and variables → Actions → New repository secret"
            echo "添加 Name=SUB_URL、Secret=你的完整订阅 URL（含 token），然后重新运行本工作流。"
            exit 1
          fi

      - name: 运行采集脚本
        env:
          SUB_URL: ${{ secrets.SUB_URL }}    # 完整订阅 URL（含 token），存于仓库 Secrets
          PROXY_URL: ${{ secrets.PROXY_URL }}   # 可选：HTTP 代理地址（住宅代理用）
          WORKER_URL: ${{ secrets.WORKER_URL }} # 可选：Cloudflare Worker 中转 URL（推荐免费方案，绕 IP 封禁）
        run: python scripts/lingdie.py

      - name: 转换为 TVBox 订阅格式
        env:
          RAW_BASE: ${{ vars.RAW_BASE }}   # 可选：仓库 Variables 中配置（如 https://raw.githubusercontent.com/<用户>/<仓库>/main/data），生成自托管订阅
        # convert 失败不阻断后续提交，避免 data/debug 调试文件无法回传
        run: python scripts/convert.py || echo "::warning::convert.py 失败，已跳过（采集数据仍会提交）"

      - name: 上传采集产物（含 data/debug/403 调试文件，便于诊断）
        if: always()   # 即使前面步骤失败也上传，保证能拿到 403 调试文件
        uses: actions/upload-artifact@v4
        with:
          name: collect-data
          path: data/
          if-no-files-found: warn
          retention-days: 7

      - name: 提交采集结果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data/
          if git diff --cached --quiet; then
            echo "内容无变化，跳过提交"
          else
            git commit -m "chore: 自动采集 $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git push
          fi
