name: Geit 链接健康检查

on:
  schedule:
    # 每小时唤醒一次，由 gate 按上一次成功运行时间放行，实际间隔 48 小时。
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      ai_mode:
        description: 'AI 辅助模式'
        required: true
        default: none
        type: choice
        options:
          - none
          - local
          - cloud
          - auto

permissions:
  contents: write

concurrency:
  group: geit-collect
  cancel-in-progress: false

jobs:
  schedule-gate:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
      ai_mode: ${{ steps.mode.outputs.ai_mode }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 判断是否到 48 小时执行窗口
        id: gate
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python - <<'PY'
          import datetime as dt
          import json
          import os
          from pathlib import Path

          interval = 48 * 3600
          now = dt.datetime.now(dt.timezone.utc)
          state = {}
          path = Path("docs/health_state.json")
          try:
              state = json.loads(path.read_text(encoding="utf-8"))
          except (OSError, ValueError):
              pass
          last_run = state.get("last_run", {})
          if not isinstance(last_run, dict):
              last_run = {}
          raw = str(last_run.get("finished_at", "") or "")
          attempt = str(last_run.get("attempted_at", "") or "")
          due = True
          if raw or attempt:
              try:
                  markers = []
                  for value in (raw, attempt):
                      if not value:
                          continue
                      parsed = dt.datetime.fromisoformat(value.replace("Z", "+00:00"))
                      if parsed.tzinfo is None:
                          parsed = parsed.replace(tzinfo=dt.timezone.utc)
                      markers.append(parsed.astimezone(dt.timezone.utc))
                  latest = max(markers)
                  elapsed = (now - latest).total_seconds()
                  due = elapsed >= interval
                  print("上次健康检查完成/尝试: %s / %s；已过 %.1f 小时"
                        % (raw or "无", attempt or "无", elapsed / 3600))
              except ValueError:
                  print("健康状态时间无法解析，立即执行")
          else:
              print("没有健康状态文件，立即执行")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write("should_run=%s\n" % ("true" if due else "false"))
          PY

      - name: 选择 AI 辅助模式
        id: mode
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            mode="${{ inputs.ai_mode }}"
          else
            mode="${{ vars.GEIT_AI_MODE }}"
            mode="${mode:-none}"
          fi
          case "$mode" in
            none|local|cloud|auto) ;;
            *) mode=none ;;
          esac
          echo "ai_mode=$mode" >> "$GITHUB_OUTPUT"
          echo "本次 AI 模式: $mode"

  health:
    needs: schedule-gate
    if: needs.schedule-gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装 ffprobe
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: 检查链接健康状态
        env:
          PYTHONIOENCODING: utf-8
          AI_MODE: ${{ needs.schedule-gate.outputs.ai_mode }}
          STRATA_BASE_URL: ${{ vars.STRATA_BASE_URL || 'https://desktop-il7932b.tail4ada60.ts.net/v1' }}
          STRATA_MODEL: ${{ vars.STRATA_MODEL || 'qwen3.8-flash-next-iq2_xs' }}
          STRATA_WIRE_API: ${{ vars.STRATA_WIRE_API || 'chat' }}
          STRATA_API_KEY: ${{ secrets.STRATA_API_KEY || secrets.LOCAL_API_KEY }}
          AI_BASE_URL: ${{ vars.AI_BASE_URL || 'https://maas-api.antdigital.com/v1' }}
          AI_MODEL: ${{ vars.AI_MODEL || 'atria-dawn-preview' }}
          AI_API_KEY: ${{ secrets.AI_API_KEY || secrets.MAAS_API_KEY }}
        run: |
          python check_health.py \
            --workers 24 \
            --max-channels 2000 \
            --budget-seconds 4200 \
            --probe

      - name: 提交健康报告
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add \
            docs/health.json \
            docs/health.csv \
            docs/blocked.csv \
            docs/removable.json \
            docs/channel_health.json \
            docs/health_state.json \
            docs/ai_review.json
          if git diff --cached --quiet; then
            echo "健康报告没有变化，跳过提交"
          else
            git commit -m "chore: 更新链接健康报告 $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M')"
            for attempt in 1 2 3; do
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "推送失败，已重试 3 次" >&2
                exit 1
              fi
              git pull --rebase origin "${GITHUB_REF_NAME}"
            done
          fi

      - name: 上传健康报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geit-health
          path: |
            docs/health.json
            docs/health.csv
            docs/blocked.csv
            docs/removable.json
            docs/channel_health.json
            docs/health_state.json
            docs/ai_review.json
          if-no-files-found: warn
          retention-days: 14
