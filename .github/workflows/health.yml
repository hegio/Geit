name: Geit 链接健康检查

on:
  schedule:
    # 每小时唤醒一次，由 gate 按上一次成功运行时间放行，实际间隔 24 小时。
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      ai_mode:
        description: 'AI 辅助模式'
        required: true
        default: none
        type: choice
        options:
          - none
          - local
          - cloud
          - auto

permissions:
  contents: write

concurrency:
  group: geit-collect
  cancel-in-progress: false

jobs:
  schedule-gate:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
      ai_mode: ${{ steps.mode.outputs.ai_mode }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 判断是否到 12 小时执行窗口
        id: gate
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python - <<'PY'
          import datetime as dt
          import json
          import os
          from pathlib import Path

          interval = 12 * 3600
          now = dt.datetime.now(dt.timezone.utc)
          state = {}
          path = Path("docs/health_state.json")
          try:
              state = json.loads(path.read_text(encoding="utf-8"))
          except (OSError, ValueError):
              pass
          last_run = state.get("last_run", {})
          if not isinstance(last_run, dict):
              last_run = {}
          raw = str(last_run.get("finished_at", "") or "")
          attempt = str(last_run.get("attempted_at", "") or "")
          due = True
          if raw or attempt:
              try:
                  markers = []
                  for value in (raw, attempt):
                      if not value:
                          continue
                      parsed = dt.datetime.fromisoformat(value.replace("Z", "+00:00"))
                      if parsed.tzinfo is None:
                          parsed = parsed.replace(tzinfo=dt.timezone.utc)
                      markers.append(parsed.astimezone(dt.timezone.utc))
                  latest = max(markers)
                  elapsed = (now - latest).total_seconds()
                  due = elapsed >= interval
                  print("上次健康检查完成/尝试: %s / %s；已过 %.1f 小时"
                        % (raw or "无", attempt or "无", elapsed / 3600))
              except ValueError:
                  print("健康状态时间无法解析，立即执行")
          else:
              print("没有健康状态文件，立即执行")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write("should_run=%s\n" % ("true" if due else "false"))
          PY

      - name: 选择 AI 辅助模式
        id: mode
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            mode="${{ inputs.ai_mode }}"
          else
            mode="${{ vars.GEIT_AI_MODE }}"
            mode="${mode:-none}"
          fi
          case "$mode" in
            none|local|cloud|auto) ;;
            *) mode=none ;;
          esac
          # The usual order is cloud first (a hosted endpoint is always up),
          # then the local model, then skip the AI step entirely. "local" keeps
          # its explicit meaning, so auto is what falls through in order.
          if [ "$mode" = "auto" ] && [ -n "${{ vars.GEIT_AI_MODE }}" ]; then
            mode="${{ vars.GEIT_AI_MODE }}"
            case "$mode" in
              none|local|cloud|auto) ;;
              *) mode=none ;;
            esac
          fi
          echo "ai_mode=$mode" >> "$GITHUB_OUTPUT"
          echo "本次 AI 模式: $mode"

  health:
    needs: schedule-gate
    if: needs.schedule-gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 130
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 准备 ffprobe
        # probe_ok is the only status that clears a failure streak, so a missing
        # ffprobe silently disables the whole dead-source mechanism. The current
        # ubuntu-latest image has no ffprobe and apt-get is too slow to finish,
        # so fetch a standalone binary instead. Never fail the job here: the
        # check still runs and degrades to HTTP-only probing.
        #
        # Two builds segfault on the runner the moment they open a network
        # stream (rc=139 "dumped core"): eugeneware/ffmpeg-static b6.1.1 and
        # johnvansickle ffmpeg 7.0.2. Both print a healthy -version, so the
        # only way to catch them is a real probe, which is why the self test
        # below is mandatory. BtbN's git-master build and Ubuntu's apt ffprobe
        # 6.1.1 both decode fine.
        run: |
          if command -v ffprobe >/dev/null 2>&1; then
            echo "使用预装 ffprobe: $(ffprobe -version | head -n1)"
            exit 0
          fi
          mkdir -p "$HOME/.local/bin"
          # Prefer apt (Ubuntu 6.1.1, verified working) but never let it block
          # the job: a slow mirror used to hang it for the whole run.
          if timeout 420 bash -c 'sudo apt-get update -qq >/dev/null 2>&1 && sudo apt-get install -y -qq ffmpeg >/dev/null 2>&1' \
             && command -v ffprobe >/dev/null 2>&1; then
            echo "已通过 apt 安装 ffprobe: $(ffprobe -version | head -n1)"
            exit 0
          fi
          echo "::warning::apt 安装 ffprobe 未成功，改用独立二进制"
          url="https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-lgpl.tar.xz"
          tmpdir="$(mktemp -d)"
          if curl -fsSL --connect-timeout 20 --max-time 420 "$url" | tar -xJf - -C "$tmpdir" --wildcards '*/bin/ffprobe' 2>/dev/null \
             && [ -n "$(find "$tmpdir" -name ffprobe -type f 2>/dev/null)" ]; then
            cp "$(find "$tmpdir" -name ffprobe -type f | head -n1)" "$HOME/.local/bin/ffprobe"
            chmod +x "$HOME/.local/bin/ffprobe"
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
            echo "已安装独立 ffprobe: $("$HOME/.local/bin/ffprobe" -version | head -n1)"
            # A ffprobe that starts but cannot decode anything turns every
            # stream into a hard failure, which is worse than having none.
            # Probe one public test stream and report the raw verdict so a
            # broken binary is visible instead of silently mislabelling links.
            self_test() {
              local probe="$1"
              local out rc
              out=$(timeout 90 "$probe" -v error -rw_timeout 15000000 \
                -analyzeduration 5000000 -probesize 5000000 \
                -user_agent "Mozilla/5.0" -show_entries stream=codec_type \
                -of csv=p=0 "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8" 2>&1)
              rc=$?
              echo "自检 rc=$rc 输出=[$out]"
              [ "$rc" -eq 0 ] && [ -n "$out" ]
            }
            if self_test "$HOME/.local/bin/ffprobe"; then
              echo "ffprobe 自检通过"
            else
              echo "::warning::ffprobe 自检未通过，本次将退化为仅 HTTP 探测（不会判定失效，也不会清零失败历史）"
              rm -f "$HOME/.local/bin/ffprobe"
              grep -v "^$HOME/.local/bin$" "$GITHUB_PATH" > "$GITHUB_PATH.tmp" || true
              mv "$GITHUB_PATH.tmp" "$GITHUB_PATH" || true
            fi
          else
            echo "::warning::ffprobe 下载失败，本次退化为仅 HTTP 探测（不会判定失效，也不会清零失败历史）"
          fi
          rm -rf "$tmpdir"

      - name: 检查链接健康状态
        env:
          PYTHONIOENCODING: utf-8
          AI_MODE: ${{ needs.schedule-gate.outputs.ai_mode }}
          STRATA_BASE_URL: ${{ vars.STRATA_BASE_URL || 'https://desktop-il7932b.tail4ada60.ts.net/v1' }}
          STRATA_MODEL: ${{ vars.STRATA_MODEL || 'qwen3.8-flash-next-iq2_xs' }}
          STRATA_WIRE_API: ${{ vars.STRATA_WIRE_API || 'chat' }}
          STRATA_API_KEY: ${{ secrets.STRATA_API_KEY || secrets.LOCAL_API_KEY }}
          AI_BASE_URL: ${{ vars.AI_BASE_URL || 'https://maas-api.antdigital.com/v1' }}
          AI_MODEL: ${{ vars.AI_MODEL || 'atria-dawn-preview' }}
          AI_API_KEY: ${{ secrets.AI_API_KEY || secrets.MAAS_API_KEY }}
        run: |
          python check_health.py \
            --workers 28 \
            --max-channels 6500 \
            --budget-seconds 6600 \
            --probe

      - name: 提交健康报告
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # health_state.json drives the 24h gate and failure streaks; without
          # it the gate sees "no state file" and runs on every hourly wake.
          git add \
            docs/health.json \
            docs/health.csv \
            docs/blocked.csv \
            docs/removable.json \
            docs/dead_channels.json \
            docs/channel_health.json \
            docs/removed_channels.json \
            docs/removed_channels.csv \
            docs/health_state.json \
            docs/ai_review.json
          if git diff --cached --quiet; then
            echo "健康报告没有变化，跳过提交"
          else
            git commit -m "chore: 更新链接健康报告 $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M')"
            for attempt in 1 2 3; do
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "推送失败，已重试 3 次" >&2
                exit 1
              fi
              git pull --rebase origin "${GITHUB_REF_NAME}"
            done
          fi

      - name: 上传健康报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geit-health
          path: |
            docs/health.json
            docs/health.csv
            docs/blocked.csv
            docs/removable.json
            docs/dead_channels.json
            docs/channel_health.json
            docs/removed_channels.json
            docs/removed_channels.csv
            docs/health_state.json
            docs/ai_review.json
          if-no-files-found: warn
          retention-days: 14
